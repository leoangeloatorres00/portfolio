name: Deploy Porfolio

on:
  push:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, ctype, fileinfo, json, tokenizer, xml, pdo, pdo_mysql, openssl, curl, zip, imagick, swoole

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      
      - name: Copy .env file
        run: |
          cp .env.example .env

      - name: Add variables to .env
        run: |
          echo "APP_OWNER=${{ secrets.APP_OWNER }}" >> .env

      - name: Update variables to .env
        run: |
          sed -i "s/^APP_NAME=.*/APP_NAME=${{ secrets.APP_NAME }}/" .env
          sed -i "s/^DB_CONNECTION=.*/DB_CONNECTION=${{ secrets.DB_CONNECTION }}/" .env
          sed -i "s/^# DB_HOST=/DB_HOST=/" .env
          sed -i "s/^# DB_PORT=/DB_PORT=/" .env
          sed -i "s/^# DB_DATABASE=/DB_DATABASE=/" .env
          sed -i "s/^# DB_USERNAME=/DB_USERNAME=/" .env
          sed -i "s/^# DB_PASSWORD=/DB_PASSWORD=/" .env
          sed -i "s/^MAIL_MAILER=.*/MAIL_MAILER=${{ secrets.MAIL_MAILER }}/" .env
          sed -i "s/^MAIL_HOST=.*/MAIL_HOST=${{ secrets.MAIL_HOST }}/" .env
          sed -i "s/^MAIL_PORT=.*/MAIL_PORT=${{ secrets.MAIL_PORT }}/" .env
          sed -i "s/^MAIL_USERNAME=.*/MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}/" .env
          sed -i "s/^MAIL_PASSWORD=.*/MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}/" .env
          sed -i "s/^MAIL_ENCRYPTION=.*/MAIL_ENCRYPTION=${{ secrets.MAIL_ENCRYPTION }}/" .env
          sed -i "s/^MAIL_FROM_ADDRESS=.*/MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}/" .env
          sed -i "s/^MAIL_FROM_NAME=.*/MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}/" .env

      - name: Install dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress
      
      - name: Generate application key
        run: |
          php artisan key:generate

      - name: Directory permissions
        run: |
          sudo chown -R $USER:$USER storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          
      - name: Run tests
        run: |
          php artisan test
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment to Server via SSH
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username:  ${{ secrets.SSH_USER }}
          key:  ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/portfolio && ./deploy.sh main